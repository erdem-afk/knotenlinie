[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "knotenlinie"
version = "0.1.0"
description = "Open earthquake-forecasting research code: ETAS-class daily models, long-term smoothed-seismicity and fault-based models, CSEP-standard scoring (Italy, California, New Zealand)."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Knotenlinie contributors" }]
requires-python = ">=3.9"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "pandas>=2.0",
    "shapely>=2.0",
    "openpyxl>=3.1",
    "pyarrow>=14",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
ml = ["scikit-learn"]
crosscheck = ["pycsep==0.8.0", "statsmodels"]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/erdem-afk/knotenlinie"

[tool.setuptools.packages.find]
include = ["knotenlinie*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "agir: heavy statistical test, run on a compute server with -m agir",
]
